{{- range .shares }}
[{{ .name }}]
path = {{ .directory }}
valid users = {{ .valid_users }}
{{ if .group }}
force group = {{ .group }}
{{ end }}
create mask = 0640
force create mode = 0640
directory mask = 0751
force directory mode = 0751
browseable = {{ .browseable }}
public = yes
writable = {{ .writable }}
guest ok = no
{{ end -}}
