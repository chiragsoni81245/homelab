profile:
  username: "default"
  email: ""

server:
  lan_cidr: "192.168.0.0/24"

ufw:
  enable_ipv6: "no"

# ------------- Uncomment this if you want to use sync-tool -------------
# sync-tool:
#   cron_schedule: ""
#   database_filepath: "/etc/sync-tool/data.db"
#   github_username: "default"
#   github_token: "<your-github-token-with-right-permissions>"
#   github_email: "<your-email>"
#   google_drive_credentials_filepath: "<path-to-google-drive-credentials-file>"

samba:
  shares:
    - name: "Media"
      directory: /DATA/Media
      valid_users: "chirag user2 user3 @group-name" 
      group: smbmedia # [optional] it can be provided to fix group of all added/edited files
      browseable: "yes"
      writable: "no"
      guest: "no"

applications:
  homelab-dashboard:
    enable: true
    username: admin
    password: default-password
    secret_key: default-secret
    data_path: "/DATA/AppData/homelab-dashboard/data"

  dns-server:
    enable: false
    config_path: "/DATA/AppData/dns-server/config"
    data_path: "/DATA/AppData/dns-server/data"
    log_path: "/DATA/AppData/dns-server/logs"

  netbird-client:
    enable: false
    setup_key: "<your_setup_key_from_netbird_dashboard>"
    config_path: "/DATA/AppData/netbird-client/config"

  ntopng:
    enable: true
    base_url: "http://192.168.0.160:9090"
    config_file: "/DATA/AppData/ntopng/config/ntopng.conf"
    redis_config_file: "/DATA/AppData/ntopng/config/redis.conf"
    data_dir: "/DATA/AppData/ntopng/data"
    timezone: "Asia/Kolkata"

  jellyfin-server: 
    enable: true
    base_url: "http://192.168.0.160:32400"
    config_path: "/DATA/AppData/jellyfin/config"
    cache_path: "/DATA/AppData/jellyfin/cache"
    media_path: "/DATA/Media"

  navidrome:
    enable: true
    base_url: "http://192.168.0.160:4533"
    data_dir: "/DATA/AppData/navidrome/data"
    data_dir: "/DATA/Media/Music"

  metube:
    enable: true
    base_url: "http://192.168.0.160:8089"
    data_dir: "/DATA/AppData/metube/data"
    temp_dir: "/DATA/AppData/metube/temp"
    video_dir: "/DATA/Media/Youtube"
    audio_dir: "/DATA/Media/Music/Youtube"

  portainer: 
    enable: true
    base_url: "http://192.168.0.160:9000"
    config_path: "/DATA/AppData/portainer"

  transmission: 
    enable: true
    base_url: "http://192.168.0.160:9091"
    username: admin
    password: default-password 
    config_path: "/DATA/AppData/transmission/config"
    downloads_path: "/DATA/Downloads/Torrent"
    watch_path: "/DATA/Downloads/Torrent/watch"

  nginx-proxy-manager:
    enable: true
    base_url: "http://192.168.0.160:81"
    data_path: "/DATA/AppData/nginx-proxy-manager/data"
    letsencrypt_path: "/DATA/AppData/nginx-proxy-manager/letsencrypt"

  web-nvim:
    enable: true
    base_url: "http://192.168.0.160:8088"
    username: chirag
    password: default-password
    # When any of uid and gid not passed default root user and root group is used is used
    uid: "" # User Id which you want to be in this container
    gid: "" # User Group Id which you want to be in this container
    user_directories:
      - name: "data"
        path: "/DATA/"
    ssh_agent: "/tmp/ssh-agent.sock"

  planka:
    enable: true
    base_url: "http://192.168.0.160:3001"
    secret_key: "my-secret-key"
    data_path: "/DATA/AppData/planka"
    admin:
      email: "email@gmail.com"
      password: "mypassword"
      name: "User"
      username: "user"
    





