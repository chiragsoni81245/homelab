name: vscode

networks:
  vscode_net:
    driver: bridge

services:
  vscode:
    environment:
      - PASSWORD={{ .password }}
      - PORT=8080
    hostname: vscode
    image: chiragsoni812/self-hosted-vscode:latest
    labels:
    labels:
      x-homelab: "ture"
      x-homelab-name: "portainer"
      x-homelab-web-url: "{{ .base_url }}:8088/"
      x-homelab-icon: https://code.visualstudio.com/assets/images/code-stable.png
    ports:
      - target: 8080
        published: "8088"
        protocol: tcp
    restart: unless-stopped
    volumes:
      {{ range $i, $v := .directories }}
      - type: bind
        source: {{ $v.path }} 
        target: /root/{{ $v.name }}
      {{ end }}
    networks:
      - vscode_net
    privileged: false
