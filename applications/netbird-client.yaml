name: netbird-client

services:
  netbird-client:
    hostname: netbird-client
    container_name: netbird-client
    image: netbirdio/netbird:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    environment:
      - NB_SETUP_KEY={{ .setup_key }}
    
    restart: always
    volumes:
      # config path
      - {{ .config_path }}:/var/lib/netbird