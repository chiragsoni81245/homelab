name: homelab-dashboard

networks:
  homelab-dashboard:
    driver: bridge

services:
  homelab-dashboard:
    environment:
      - HostProc=/host/proc
      - HostSys=/host/sys
      - HostEtc=/host/etc
      - APP_DATABASE_URI=file:/data/data.db?cache=shared&mode=rwc
      - APP_SERVER_PORT=8080
      - APP_SERVER_LOG_LEVEL=debug
      - APP_SERVER_SECRET_KEY={{ .secret_key }}
      - APP_SERVER_ADMIN_AUTH_USERNAME={{ .username }}
      - APP_SERVER_ADMIN_AUTH_PASSWORD={{ .password }}
    hostname: homelab-dashboard
    image: chiragsoni812/homelab-dashboard:latest
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /proc 
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys 
        target: /host/sys
        read_only: true
      - type: bind
        source: /etc 
        target: /host/etc
        read_only: true
      - type: bind
        source: /var/run/docker.sock 
        target: /var/run/docker.sock
        read_only: true

      - type: bind
        source: {{ .data_path }}
        target: /data
    networks:
      - homelab-dashboard
    privileged: true
